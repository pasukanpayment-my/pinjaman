<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semakan Akaun Peminjam</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-top: 20px;}
    .btn-link { display: inline-block; background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; margin-top: 10px; font-size: 14px; font-weight: bold; border: none; cursor: pointer;}
    img.bukti { max-width: 100%; border-radius: 4px; margin-top: 10px; display: block; border: 1px solid #eee; }
  </style>

  <!-- Script OneSignal -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(function(OneSignal) {
      OneSignal.init({
        appId: "cfbf6fcb-7575-4a0e-86d6-662517972b86", 
        notifyButton: { enable: false },
      });
    });
  </script>
</head>
<body>

  <h2>Semakan Status Akaun</h2>
  
  <div id="hasilPaparan"><p style="color:red;">Akses ditolak. Sila gunakan pautan (link) rasmi yang mengandungi No Akaun untuk menyemak status anda.</p></div>

  <script>
    const urlAPI = "https://script.google.com/macros/s/AKfycbw5V9MtDo_ejLyJpjVjBu4UNQTXR-bqreIt1Em4n6SEVG4X2WOnNBy7afcQFGPSeek4/exec";

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const idDariLink = urlParams.get('id'); 
      
      if (idDariLink) {
        prosesSemakan(idDariLink);
      }
    };

    // Fungsi mengubah link Google Drive menjadi Direct Link (Bypass Aplikasi Android)
    function tukarLinkDriveDirect(urlAsli) {
      let fileId = "";
      // Mencari ID fail di dalam link asal Google Drive
      let match1 = urlAsli.match(/\/d\/([a-zA-Z0-9_-]+)/);
      let match2 = urlAsli.match(/id=([a-zA-Z0-9_-]+)/);
      
      if (match1) fileId = match1[1];
      else if (match2) fileId = match2[1];
      
      if (fileId) {
        // Mengembalikan link direct yang tidak akan meminta akaun Google
        return `https://drive.google.com/uc?export=view&id=${fileId}`;
      }
      return urlAsli;
    }

    // Fungsi memicu notifikasi native browser & buka gambar
    function aksiBukaGambar(urlAsli) {
      // 1. Memanggil kotak izin NATIVE browser (Pasti muncul)
      window.OneSignalDeferred.push(function(OneSignal) {
        OneSignal.Notifications.requestPermission();
      });
      
      // 2. Buka gambar direct link di tab baru tanpa login
      let urlDirect = tukarLinkDriveDirect(urlAsli);
      window.open(urlDirect, '_blank');
    }

    function prosesSemakan(noAkun) {
      const tempatHasil = document.getElementById('hasilPaparan');
      tempatHasil.innerHTML = "<p>Sedang menyemak pangkalan data...</p>";

      fetch(`${urlAPI}?noAkun=${noAkun}`)
        .then(response => response.json())
        .then(res => {
          if (res.status === 'success') {
            const data = res.data;
            
            let paparanHTML = `
              <div class="card">
                <h3>Butiran Peminjam</h3>
                <p><strong>No Akaun:</strong> ${data.noAkun}</p>
                <p><strong>Nama Peminjam:</strong> ${data.nama}</p>
                <p><strong>Jumlah Pinjaman Asli:</strong> RM ${data.asli}</p>
                <p><strong>Jumlah Settle Diskaun:</strong> RM ${data.diskaun}</p>
            `;

            if (data.gambar) {
              let urlDirect = tukarLinkDriveDirect(data.gambar);
              paparanHTML += `
                <p><strong>Dokumen / Bukti:</strong></p>
                <!-- Menampilkan gambar terus di skrin tanpa perlu klik -->
                <img src="${urlDirect}" class="bukti" alt="Bukti Penyata" onerror="this.style.display='none'">
                
                <button onclick="aksiBukaGambar('${data.gambar}')" class="btn-link">Buka Gambar Saiz Penuh</button>
              `;
            }

            paparanHTML += `</div>`;
            tempatHasil.innerHTML = paparanHTML;
          } else {
            tempatHasil.innerHTML = `<p style='color:red;'>Ralat: ${res.message}</p>`;
          }
        })
        .catch(error => {
          tempatHasil.innerHTML = "<p style='color:red;'>Gagal menyambung ke sistem. Sila cuba sebentar lagi.</p>";
        });
    }
  </script>
</body>
</html>
