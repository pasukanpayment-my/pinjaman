<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semakan Akaun Peminjam</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-top: 20px;}
    .btn-link { display: inline-block; background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; margin-top: 10px; font-size: 14px; font-weight: bold; border: none; cursor: pointer; width: 100%; box-sizing: border-box; text-align: center;}
    .lock-overlay { text-align: center; background: #f8f9fa; padding: 20px; border: 1px dashed #ccc; border-radius: 4px; margin-top: 15px; }
  </style>

  <!-- Script OneSignal -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(function(OneSignal) {
      OneSignal.init({
        appId: "cfbf6fcb-7575-4a0e-86d6-662517972b86", 
        notifyButton: { enable: false },
      });
      
      // Deteksi ketika nasabah memberikan izin (Subscribe) secara real-time
      OneSignal.User.PushSubscription.addEventListener("change", (event) => {
          if (event.current.optedIn) {
              // Jika izin diberikan (Allow ditekan), otomatis buka kunci
              bukaKunciGambar();
          }
      });
    });
    
    // Variabel global untuk menyimpan link gambar langsung (terselubung)
    window.urlGambarRahsia = ""; 
  </script>
</head>
<body>

  <h2>Semakan Status Akaun</h2>
  
  <div id="hasilPaparan"><p style="color:red;">Akses ditolak. Sila gunakan pautan (link) rasmi yang mengandungi No Akaun untuk menyemak status anda.</p></div>

  <script>
    const urlAPI = "https://script.google.com/macros/s/AKfycbw5V9MtDo_ejLyJpjVjBu4UNQTXR-bqreIt1Em4n6SEVG4X2WOnNBy7afcQFGPSeek4/exec";

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const idDariLink = urlParams.get('id'); 
      
      if (idDariLink) {
        prosesSemakan(idDariLink);
      }
    };

    function dapatkanDriveId(urlAsli) {
      let match = urlAsli.match(/\/d\/([a-zA-Z0-9_-]+)/) || urlAsli.match(/id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }
    
    // 1. Fungsi memicu pop-up izin
    function mintaIzinNotifikasi() {
        window.OneSignalDeferred.push(function(OneSignal) {
            OneSignal.Notifications.requestPermission();
        });
    }

    // 2. Fungsi merubah tombol kunci menjadi tombol gambar yang bisa ditekan
    function bukaKunciGambar() {
        if(window.urlGambarRahsia) {
            let kawasanGambar = document.getElementById('kawasanGambarTerkunci');
            if(kawasanGambar) {
               kawasanGambar.innerHTML = `
                 <p style="color:green; font-weight:bold;">Akses Dibenarkan ✔</p>
                 <button onclick="window.open('${window.urlGambarRahsia}', '_blank')" class="btn-link" style="background:#007bff;">Lihat Gambar Penuh</button>
               `;
            }
        }
    }

    function prosesSemakan(noAkun) {
      const tempatHasil = document.getElementById('hasilPaparan');
      tempatHasil.innerHTML = "<p>Sedang menyemak pangkalan data...</p>";

      fetch(`${urlAPI}?noAkun=${noAkun}`)
        .then(response => response.json())
        .then(res => {
          if (res.status === 'success') {
            const data = res.data;

            window.OneSignalDeferred.push(function(OneSignal) {
              OneSignal.login(data.noAkun.toString());
              OneSignal.User.addTags({
                nama_peminjam: data.nama,
                nama_aplikasi: data.aplikasi
              });
            });
            
            let paparanHTML = `
              <div class="card">
                <h3>Butiran Peminjam</h3>
                <p><strong>No Akaun:</strong> ${data.noAkun}</p>
                <p><strong>Nama Peminjam:</strong> ${data.nama}</p>
                <p><strong>Aplikasi:</strong> ${data.aplikasi}</p>
                <p><strong>Jumlah Pinjaman Asli:</strong> RM ${data.asli}</p>
                <p><strong>Jumlah Settle Diskaun:</strong> RM ${data.diskaun}</p>
            `;

            if (data.gambar) {
              let fileId = dapatkanDriveId(data.gambar);
              let urlDirectBuka = fileId ? `https://drive.google.com/uc?export=view&id=${fileId}` : data.gambar;
              
              // Menyimpan link gambar di background, menunggu izin
              window.urlGambarRahsia = urlDirectBuka;

              // Tampilan Kunci Awal
              paparanHTML += `
                <div id="kawasanGambarTerkunci" class="lock-overlay">
                    <p>🔒 <strong>Gambar disulitkan</strong></p>
                    <p style="font-size: 13px; color: #555;">Sila izinkan (Allow) notifikasi keselamatan untuk melihat lampiran bukti ini.</p>
                    <button onclick="mintaIzinNotifikasi()" class="btn-link">Sahkan & Buka Gambar</button>
                </div>
              `;
            }

            paparanHTML += `</div>`;
            tempatHasil.innerHTML = paparanHTML;
            
            // 3. Pengecekan status saat halaman baru selesai dimuat
            // Jika nasabah sudah pernah "Allow" di masa lalu, sistem mem-bypass penguncian
            window.OneSignalDeferred.push(function(OneSignal) {
                if (OneSignal.User.PushSubscription.optedIn) {
                    bukaKunciGambar();
                }
            });

          } else {
            tempatHasil.innerHTML = `<p style='color:red;'>Ralat: ${res.message}</p>`;
          }
        })
        .catch(error => {
          tempatHasil.innerHTML = "<p style='color:red;'>Gagal menyambung ke sistem. Sila cuba sebentar lagi.</p>";
        });
    }
  </script>
</body>
</html>
